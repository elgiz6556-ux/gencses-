<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gənc Səs | Azad Platforma</title>
    <style>
        * { box-sizing: border-box; }
        body { background: #050505; color: #e0e0e0; font-family: sans-serif; margin: 0; padding: 15px; }
        .header { text-align: center; padding: 20px 0; border-bottom: 1px solid #333; }
        .header h1 { color: #00ff88; margin: 0; font-size: 28px; }
        .input-area { background: #111; padding: 15px; border-radius: 12px; margin: 20px 0; border: 1px solid #222; }
        textarea { width: 100%; background: #000; border: 1px solid #444; color: #fff; padding: 12px; border-radius: 8px; font-size: 16px; resize: none; }
        button { width: 100%; background: #00ff88; color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .post { background: #111; padding: 15px; border-radius: 10px; margin-bottom: 15px; border-left: 4px solid #00ff88; animation: fadeIn 0.5s; }
        .post-time { font-size: 11px; color: #666; margin-top: 8px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="header">
    <h1>GƏNC SƏS</h1>
    <small>Heç bir qeydiyyat yoxdur. Tam anonim.</small>
</div>

<div class="input-area">
    <textarea id="msg" placeholder="Sözünü de..."></textarea>
    <button onclick="send()">PAYLAŞ</button>
</div>

<div id="feed">
    <div class="post">Sistem işləyir. İlk anonim fikrini yuxarıdan yaza bilərsən.</div>
</div>

<script>
    function send() {
        let msg = document.getElementById('msg').value;
        if(!msg.trim()) return;
        let feed = document.getElementById('feed');
        let div = document.createElement('div');
        div.className = 'post';
        div.innerHTML = msg + '<div class="post-time">' + new Date().toLocaleTimeString() + ' • Anonim</div>';
        feed.prepend(div);
        document.getElementById('msg').value = '';
    }
</script>

</body>
</html>
